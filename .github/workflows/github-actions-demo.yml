name: CI - Node.js with ESLint, Prettier, and CodeQL
run-name: >
  ${{ github.event_name == 'pull_request' && format('{0} is creating a PR from {1} to {2} 🚀', github.actor, github.head_ref, github.base_ref) || format('{0} is pushing to {1}', github.actor, github.ref_name) }}

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  check-commit-message:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Check commit message format
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B | tr -d '\n')
          echo "🔍 Commit message: '$COMMIT_MSG'"
          echo "$COMMIT_MSG" | grep -E '^(feat|fix|chore|docs|refactor|test): .+' || {
            echo "❌ Commit message must follow conventional format (e.g., 'feat: add feature')"
            exit 1
          }

  check-changeset:
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.pull_request.title, 'NOISSUE')"
    steps:
      - uses: actions/checkout@v3
      - name: Check for changeset
        run: |
          if ! git diff --name-only origin/main...HEAD | grep -q '\.changeset/.*\.md'; then
            echo "❌ Missing changeset file in PR" && exit 1;
          fi

  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: npm ci
      - name: Check formatting with Prettier
        run: npm run ci:prettier

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: npm ci
      - name: Run lint + test via package script
        run: npm run ci:lint

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: npm ci
      - run: npm run test:unit

  build:
    runs-on: ubuntu-latest
    needs: [lint, 'unit-test']
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: dist/

  release-canary:
    runs-on: ubuntu-latest
    needs:
      [check-commit-message, check-changeset, lint, unit-test, prettier, build]
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: npm ci
      - run: npx changeset version
      - run: npm publish --tag canary --access public

  deploy-preview:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build
          path: ./dist
      - name: Deploy to preview
        run: |
          PREVIEW_URL=https://preview.example.com/pr-${{ github.event.pull_request.number }}
          echo "Preview deployed at $PREVIEW_URL"
          echo "$PREVIEW_URL" > preview.txt
      - name: Comment on PR with preview URL
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: preview.txt
